  <link rel="preconnect" href="https://fonts.googleapis.com">

  <base href="../">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap { max-width: 1360px; margin: 0 auto; padding: 56px 24px 40px; }
    .wrap h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 8px; }
    .intro { max-width: 760px; }
    .tbl { overflow-x: auto; margin-top: 10px; }
    table { border-collapse: collapse; width: auto; font-size: 16px; line-height: 1.4; }
    th { text-align: left; font-weight: 600; color: var(--text); font-size: 15px;
          border-bottom: 1px solid var(--text); padding: 6px 18px 6px 0; vertical-align: bottom; white-space: nowrap; }
    td { border-bottom: 1px solid var(--rule); padding: 8px 18px 8px 0; vertical-align: top; }
    th:last-child, td:last-child { padding-right: 0; }
    td.school { max-width: 250px; }
    td.fac { max-width: 230px; }
    .fn { white-space: nowrap; }
    td a { white-space: nowrap; }
    .sort { margin-top: 22px; font-size: 15px; color: var(--muted); }
    .sort button { font: inherit; color: var(--accent); background: none; border: 1px solid var(--rule);
                    border-radius: 4px; padding: 2px 10px; margin-left: 6px; cursor: pointer; }
    .sort button.on { color: var(--text); border-color: var(--text); font-weight: 600; }
    tr.past td { opacity: 0.45; }
    tr.soon td.days { color: #b3261e; font-weight: 500; }
    .prog { color: var(--muted); font-size: 14px; }
    .note { font-size: 14px; margin-top: 2px; }
    .dl { white-space: nowrap; }
    .days, .n { white-space: nowrap; }
    .st { text-align: center; white-space: nowrap; padding-right: 10px; padding-left: 10px; }
    .ok { color: #1b7a3a; font-weight: 500; }
    .muted { color: var(--muted); }
    .todo { color: #a3a3a3; white-space: nowrap; cursor: default; }
    #login input { font: inherit; padding: 6px 10px; border: 1px solid #bbb; border-radius: 4px; width: 240px; }
    #login button { font: inherit; padding: 6px 14px; margin-left: 6px; border: 1px solid var(--text); background: var(--text);
                     color: #fff; border-radius: 4px; cursor: pointer; }
    .err { color: #b3261e; margin-top: 10px; }
    #sync { margin-left: 14px; font-size: 14px; }
    td.st input { width: 17px; height: 17px; accent-color: #1b7a3a; cursor: pointer; }
    .group th { border-bottom: none; padding-bottom: 0; text-align: center; font-weight: 500; color: var(--muted); font-size: 13px; }
  </style>
</head>

  function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
  async function aesKey(raw) { return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]); }
  async function decrypt(key, buf) {
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)));
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" }, base, 256));
  }
  const MIME = { pdf: "application/pdf", html: "text/html;charset=utf-8",
                 docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" };
  async function openPage(raw) {
    const key = await aesKey(raw);
    const page = new TextDecoder().decode(await decrypt(key, b64(DATA)));
    document.getElementById("login").hidden = true;
    document.getElementById("content").innerHTML = page;
    init();
    document.getElementById("forget").addEventListener("click", e => {
      e.preventDefault(); localStorage.removeItem(STORE); location.reload();
    });
    document.querySelectorAll("#content a[data-fn]").forEach(a => a.addEventListener("click", async e => {
      e.preventDefault();
      const fn = a.dataset.fn, ext = fn.split(".").pop(), view = ext !== "docx";
      const w = view ? window.open("", "_blank") : null;
      const buf = new Uint8Array(await (await fetch(a.getAttribute("href"))).arrayBuffer());
      const url = URL.createObjectURL(new Blob([await decrypt(key, buf)], { type: MIME[ext] || "application/octet-stream" }));
      if (w) { w.location.href = url; }
      else { const d = document.createElement("a"); d.href = url; d.download = fn; document.body.appendChild(d); d.click(); d.remove(); }
    }));
  }
  function init() {

    const t = new Date(); t.setHours(0, 0, 0, 0);
    document.querySelectorAll('td.days[data-due]').forEach(td => {
      const [y, m, d] = td.dataset.due.split('-').map(Number);
      const n = Math.round((new Date(y, m - 1, d) - t) / 86400000);
      const tr = td.closest('tr');
      if (n < 0) { td.textContent = 'Passed'; tr.classList.add('past'); }
      else if (n === 0) { td.textContent = 'Today'; tr.classList.add('soon'); }
      else { td.textContent = n + (n === 1 ? ' day' : ' days'); if (n <= 7) tr.classList.add('soon'); }
    });
    const tbody = document.querySelector('tbody');
    const rows = [...tbody.rows].map((r, i) => (r.dataset.i = i, r));
    document.querySelectorAll('.sort button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.sort button').forEach(x => x.classList.toggle('on', x === b));
      const k = b.dataset.key;
      rows.slice().sort((a, c) => k === 'name'
        ? a.dataset.name.localeCompare(c.dataset.name)
        : (a.dataset.due.localeCompare(c.dataset.due) || a.dataset.i - c.dataset.i))
        .forEach(r => tbody.appendChild(r));
    }));
    const tbl = document.getElementById('tbl'), api = tbl.dataset.api, tok = tbl.dataset.token;
    const sync = document.getElementById('sync');
    const boxes = [...document.querySelectorAll('input[data-tick]')];
    const apply = ticks => boxes.forEach(b => { b.checked = !!ticks[b.dataset.tick]; b.disabled = false; });
    if (api) {
      sync.textContent = 'Loading ticks...';
      fetch(api + '?token=' + encodeURIComponent(tok)).then(r => r.json()).then(j => {
        if (!j.ok) throw new Error(j.error); apply(j.ticks); sync.textContent = '';
      }).catch(() => { sync.textContent = 'Could not load ticks. Please reload the page.'; });
      boxes.forEach(b => b.addEventListener('change', async () => {
        const want = b.checked; b.disabled = true; sync.textContent = 'Saving...';
        try {
          const r = await fetch(api, { method: 'POST', body: JSON.stringify({ token: tok, key: b.dataset.tick, submitted: want }) });
          const j = await r.json(); if (!j.ok) throw new Error(j.error);
          apply(j.ticks); sync.textContent = 'Saved';
          setTimeout(() => { if (sync.textContent === 'Saved') sync.textContent = ''; }, 2000);
        } catch (e) { b.checked = !want; b.disabled = false; sync.textContent = 'Could not save. Please try again.'; }
      }));
    }
  }
  (async () => {
    const saved = localStorage.getItem(STORE);
    if (saved) {
      try { await openPage(b64(saved)); return; } catch (e) { localStorage.removeItem(STORE); }
    }
    const form = document.getElementById("login");
    form.hidden = false;
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const btn = form.querySelector("button"); btn.disabled = true;
      try {
        const raw = await derive(document.getElementById("pw").value);
        await openPage(raw);
        localStorage.setItem(STORE, btoa(String.fromCharCode(...raw)));
      } catch (err) { document.getElementById("err").hidden = false; }
      btn.disabled = false;
    });
  })();
  </script>
